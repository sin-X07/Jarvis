[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent"
version = "0.2.0"
description = "Jarvis：一个能跑的最小 personal agent（DeepSeek 驱动）"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]

[project.scripts]
jarvis = "chat:main"

[tool.setuptools]
py-modules = [
    "agent", "audit", "chat", "checkpoint",
    "compaction", "config", "diffutil", "gui", "hooks", "jlog",
    "jobs", "mcp_client", "md", "memory", "model", "permissions",
    "planner", "plugins", "policy", "project", "server",
    "session_store", "shell_tools", "skills", "smoke_test",
    "subagent", "todo", "tools", "trajectory", "update",
    "usage", "worker",
]
