[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent"
version = "0.2.0"
description = "Jarvis：一个能跑的最小 personal agent（DeepSeek 驱动）"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]

[project.scripts]
jarvis = "jarvis.ui.chat:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]  # 只打包 jarvis 包及其子包；tests/ 不是包，不打包
